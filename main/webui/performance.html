<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoopCLI - 性能监控</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text2: #8b949e;
  --accent: #58a6ff;
  --accent-gradient: linear-gradient(135deg, #58a6ff, #8b5cf6);
  --green: #06d6a0;
  --yellow: #ffd000;
  --red: #ff4757;
  --radius: 12px;
}
body {
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  padding: 20px;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.header h1 {
  font-size: 24px;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.back-btn {
  padding: 8px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  transition: all 0.2s;
}
.back-btn:hover {
  background: var(--surface2);
  border-color: var(--accent);
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.stat-card .label {
  color: var(--text2);
  font-size: 12px;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.stat-card .value {
  font-size: 32px;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat-card .change {
  font-size: 13px;
  margin-top: 8px;
}
.stat-card .change.positive { color: var(--green); }
.stat-card .change.negative { color: var(--red); }
.chart-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
}
.chart-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
}
.chart {
  height: 200px;
  display: flex;
  align-items: flex-end;
  gap: 4px;
  padding: 10px 0;
}
.bar {
  flex: 1;
  background: var(--accent-gradient);
  border-radius: 4px 4px 0 0;
  transition: height 0.3s;
  min-height: 4px;
}
.bar:hover {
  opacity: 0.8;
}
</style>
</head>
<body>
<div class="header">
  <h1>📊 性能监控</h1>
  <a href="/" class="back-btn">← 返回</a>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="label">页面加载时间</div>
    <div class="value" id="load-time">-</div>
    <div class="change" id="load-time-change"></div>
  </div>
  <div class="stat-card">
    <div class="label">API 响应时间</div>
    <div class="value" id="api-time">-</div>
    <div class="change" id="api-time-change"></div>
  </div>
  <div class="stat-card">
    <div class="label">Token 使用</div>
    <div class="value" id="token-usage">-</div>
    <div class="change" id="token-change"></div>
  </div>
  <div class="stat-card">
    <div class="label">Agent 运行次数</div>
    <div class="value" id="agent-runs">-</div>
    <div class="change" id="runs-change"></div>
  </div>
</div>

<div class="chart-container">
  <div class="chart-title">加载时间趋势（最近20次）</div>
  <div class="chart" id="load-chart"></div>
</div>

<div class="chart-container">
  <div class="chart-title">Token 使用趋势（最近20次）</div>
  <div class="chart" id="token-chart"></div>
</div>

<script>
// 模拟数据（实际应该从API获取）
const loadHistory = [1200, 1150, 1100, 1080, 1090, 1070, 1050, 1060, 1040, 1030, 1020, 1010, 1000, 990, 980, 970, 960, 950, 940, 930];
const tokenHistory = [15000, 14800, 14600, 14500, 14400, 14300, 14200, 14100, 14000, 13900, 13800, 13700, 13600, 13500, 13400, 13300, 13200, 13100, 13000, 12900];

function renderChart(containerId, data, max) {
  const container = document.getElementById(containerId);
  const maxVal = Math.max(...data);
  container.innerHTML = data.map(val => {
    const height = (val / maxVal) * 100;
    return `<div class="bar" style="height: ${height}%;" title="${val}"></div>`;
  }).join('');
}

function updateStats() {
  const loadTime = performance.now().toFixed(0);
  document.getElementById('load-time').textContent = loadTime + 'ms';
  document.getElementById('load-time-change').innerHTML = '<span class="positive">↓ 2.3%</span> vs 上次';

  document.getElementById('api-time').textContent = '45ms';
  document.getElementById('api-time-change').innerHTML = '<span class="positive">↓ 5.2%</span> vs 上次';

  document.getElementById('token-usage').textContent = '12.9K';
  document.getElementById('token-change').innerHTML = '<span class="positive">↓ 1.5%</span> vs 上次';

  document.getElementById('agent-runs').textContent = '263';
  document.getElementById('runs-change').innerHTML = '<span class="positive">↑ 0.4%</span> vs 上次';
}

// 初始化
updateStats();
renderChart('load-chart', loadHistory, 1500);
renderChart('token-chart', tokenHistory, 16000);

// 自动刷新
setInterval(() => {
  updateStats();
  // 添加新数据点
  loadHistory.shift();
  loadHistory.push(Math.floor(Math.random() * 100) + 900);
  renderChart('load-chart', loadHistory, 1500);
}, 5000);
</script>
</body>
</html>
