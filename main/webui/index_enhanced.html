<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoopCLI - Agent 控制台 v6 Enhanced</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* v6 配色 - 增强玻璃态主题 */
  --bg: #030610;
  --surface: rgba(12, 18, 30, 0.85);
  --surface2: rgba(20, 30, 50, 0.7);
  --border: rgba(90, 110, 150, 0.15);
  --text: #f8faff;
  --text2: #7a8aa0;

  /* 品牌色 - 霓虹渐变 */
  --accent: #b794f6;
  --accent2: #ff6b9d;
  --accent3: #4de1ff;
  --accent-gradient: linear-gradient(135deg, #b794f6 0%, #ff6b9d 50%, #4de1ff 100%);
  --accent-gradient-subtle: linear-gradient(135deg, rgba(183, 148, 246, 0.18) 0%, rgba(255, 107, 157, 0.18) 50%, rgba(77, 225, 255, 0.18) 100%);

  /* 状态色 */
  --green: #00ff88;
  --green-bg: rgba(0, 255, 136, 0.15);
  --green-glow: rgba(0, 255, 136, 0.6);
  --yellow: #ffd93d;
  --yellow-bg: rgba(255, 217, 61, 0.15);
  --yellow-glow: rgba(255, 217, 61, 0.6);
  --red: #ff6b6b;
  --red-bg: rgba(255, 107, 107, 0.15);
  --red-glow: rgba(255, 107, 107, 0.6);

  --radius: 20px;
  --radius-sm: 12px;
  --radius-lg: 28px;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  --shadow-sm: 0 5px 20px rgba(0, 0, 0, 0.3);
  --shadow-glow: 0 0 50px rgba(183, 148, 246, 0.4);

  --transition-fast: 0.12s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 粒子背景 */
#particles-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
}

/* 增强玻璃态 */
.glass-card {
  background: var(--surface);
  backdrop-filter: blur(25px) saturate(200%);
  -webkit-backdrop-filter: blur(25px) saturate(200%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-normal);
  position: relative;
  overflow: hidden;
}
.glass-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--accent-gradient);
  opacity: 0.5;
}
.glass-card:hover {
  transform: translateY(-3px) scale(1.01);
  box-shadow: var(--shadow), 0 0 30px rgba(183, 148, 246, 0.25);
  border-color: rgba(183, 148, 246, 0.4);
}

/* 霓虹发光效果 */
.neon-glow {
  box-shadow: 0 0 20px rgba(183, 148, 246, 0.3),
              0 0 40px rgba(183, 148, 246, 0.2),
              0 0 60px rgba(183, 148, 246, 0.1);
}
.neon-glow:hover {
  box-shadow: 0 0 30px rgba(183, 148, 246, 0.5),
              0 0 60px rgba(183, 148, 246, 0.3),
              0 0 90px rgba(183, 148, 246, 0.2);
}

/* 3D卡片效果 */
.card-3d {
  transform-style: preserve-3d;
  perspective: 1000px;
}
.card-3d .glass-card {
  transform: rotateX(0deg) rotateY(0deg);
  transition: transform var(--transition-slow);
}

/* 液体按钮 */
.liquid-btn {
  position: relative;
  padding: 14px 28px;
  background: var(--accent-gradient);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  overflow: hidden;
  transition: all var(--transition-normal);
  box-shadow: 0 4px 15px rgba(183, 148, 246, 0.4);
}
.liquid-btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}
.liquid-btn:hover::before {
  width: 300px;
  height: 300px;
}
.liquid-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(183, 148, 246, 0.6);
}

/* 图表容器 */
.chart-container {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
}
.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.chart-title {
  font-size: 16px;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.chart-canvas-wrapper {
  position: relative;
  width: 100%;
  height: 300px;
}

/* 实时数据指示器 */
.live-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--green);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.live-indicator::before {
  content: '';
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 50%;
  animation: livePulse 1.5s infinite;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

/* 布局 */
body {
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

.sidebar {
  width: 300px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.sidebar::after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--accent-gradient);
  opacity: 0.4;
  filter: blur(1px);
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 32px;
  scroll-behavior: smooth;
}

/* 页面切换动画 */
.page { display: none; }
.page.active { display: block; animation: pageIn 0.4s ease; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(15px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 统计卡片网格 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

.stat-card {
  padding: 24px;
  position: relative;
}
.stat-value {
  font-size: 32px;
  font-weight: 900;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 12px 0;
}
.stat-label {
  font-size: 12px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 700;
}
.stat-change {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  display: inline-block;
  margin-top: 8px;
}
.stat-change.positive {
  background: var(--green-bg);
  color: var(--green);
}
.stat-change.negative {
  background: var(--red-bg);
  color: var(--red);
}

/* 侧边栏导航 */
.brand {
  padding: 32px 24px;
  border-bottom: 1px solid var(--border);
}
.brand h1 {
  font-size: 24px;
  font-weight: 900;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand h1::before {
  content: '∞';
  font-size: 28px;
  -webkit-text-fill-color: var(--accent);
  animation: rotate 15s linear infinite;
}
@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.nav {
  padding: 24px 16px;
  flex: 1;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text2);
  transition: all var(--transition-normal);
  font-size: 14px;
  font-weight: 600;
  position: relative;
  margin-bottom: 8px;
}
.nav-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--accent-gradient);
  transform: scaleY(0);
  transition: transform var(--transition-normal);
  border-radius: 0 4px 4px 0;
}
.nav-item:hover {
  color: var(--text);
  transform: translateX(6px);
  background: var(--surface2);
}
.nav-item.active {
  color: var(--accent);
  background: rgba(183, 148, 246, 0.15);
}
.nav-item.active::before {
  transform: scaleY(1);
}
.nav-item .icon {
  font-size: 20px;
  width: 24px;
  text-align: center;
}

/* 页面标题 */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}
.page-title {
  font-size: 28px;
  font-weight: 900;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* 响应式 */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: -300px;
    top: 0;
    bottom: 0;
    z-index: 100;
    transition: left var(--transition-normal);
  }
  .sidebar.open { left: 0; }
  .stats-grid { grid-template-columns: 1fr; }
}

/* 滚动条美化 */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
}
</style>
</head>
<body>
<canvas id="particles-canvas"></canvas>

<div class="app">
  <!-- 侧边栏 -->
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <h1>LoopCLI</h1>
      <div style="font-size: 10px; color: var(--text2); margin-top: 6px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700;">
        Agent Console v6
      </div>
    </div>
    <div class="nav">
      <div class="nav-item active" data-page="dashboard">
        <span class="icon">📊</span>
        <span>仪表盘</span>
      </div>
      <div class="nav-item" data-page="agents">
        <span class="icon">🤖</span>
        <span>Agents</span>
      </div>
      <div class="nav-item" data-page="tasks">
        <span class="icon">✅</span>
        <span>任务</span>
      </div>
      <div class="nav-item" data-page="logs">
        <span class="icon">📝</span>
        <span>日志</span>
      </div>
      <div class="nav-item" data-page="control">
        <span class="icon">🎮</span>
        <span>控制台</span>
      </div>
      <div class="nav-item" data-page="messages">
        <span class="icon">💬</span>
        <span>消息</span>
      </div>
      <div class="nav-item" data-page="analytics">
        <span class="icon">📈</span>
        <span>分析</span>
      </div>
    </div>
  </div>

  <!-- 主内容区 -->
  <div class="main">
    <div class="content">
      <!-- 仪表盘页面 -->
      <div class="page active" id="page-dashboard">
        <div class="page-header">
          <h1 class="page-title">仪表盘</h1>
          <div class="live-indicator">● 实时更新中</div>
        </div>

        <div class="stats-grid">
          <div class="glass-card stat-card">
            <div class="stat-label">活跃 Agents</div>
            <div class="stat-value" id="stat-agents">0</div>
            <div class="stat-change positive">↑ 2 新增</div>
          </div>
          <div class="glass-card stat-card">
            <div class="stat-label">运行任务</div>
            <div class="stat-value" id="stat-tasks">0</div>
            <div class="stat-change positive">↑ 12%</div>
          </div>
          <div class="glass-card stat-card">
            <div class="stat-label">Token 使用</div>
            <div class="stat-value" id="stat-tokens">0</div>
            <div class="stat-change negative">↓ 5%</div>
          </div>
          <div class="glass-card stat-card">
            <div class="stat-label">运行时间</div>
            <div class="stat-value" id="stat-uptime">0h</div>
            <div class="stat-change positive">● 稳定</div>
          </div>
        </div>

        <div class="chart-container">
          <div class="chart-header">
            <div class="chart-title">Token 使用趋势</div>
            <div class="live-indicator">● 实时</div>
          </div>
          <div class="chart-canvas-wrapper" id="token-chart"></div>
        </div>

        <div class="chart-container">
          <div class="chart-header">
            <div class="chart-title">Agent 活动热力图</div>
          </div>
          <div class="chart-canvas-wrapper" id="activity-chart"></div>
        </div>
      </div>

      <!-- 其他页面占位 -->
      <div class="page" id="page-agents">
        <div class="page-header">
          <h1 class="page-title">Agents</h1>
        </div>
        <div class="glass-card" style="padding: 24px;">
          <p>Agent 管理功能开发中...</p>
        </div>
      </div>

      <div class="page" id="page-tasks">
        <div class="page-header">
          <h1 class="page-title">任务</h1>
        </div>
        <div class="glass-card" style="padding: 24px;">
          <p>任务管理功能开发中...</p>
        </div>
      </div>

      <div class="page" id="page-logs">
        <div class="page-header">
          <h1 class="page-title">日志</h1>
        </div>
        <div class="glass-card" style="padding: 24px;">
          <p>日志查看功能开发中...</p>
        </div>
      </div>

      <div class="page" id="page-control">
        <div class="page-header">
          <h1 class="page-title">控制台</h1>
        </div>
        <div class="glass-card" style="padding: 24px;">
          <p>控制台功能开发中...</p>
        </div>
      </div>

      <div class="page" id="page-messages">
        <div class="page-header">
          <h1 class="page-title">消息</h1>
        </div>
        <div class="glass-card" style="padding: 24px;">
          <p>消息管理功能开发中...</p>
        </div>
      </div>

      <div class="page" id="page-analytics">
        <div class="page-header">
          <h1 class="page-title">分析</h1>
        </div>
        <div class="glass-card" style="padding: 24px;">
          <p>数据分析功能开发中...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="particles.js"></script>
<script src="charts.js"></script>
<script>
// 初始化粒子系统
const particlesCanvas = document.getElementById('particles-canvas');
const particleSystem = new EnhancedParticleSystem(particlesCanvas, {
  particleCount: 100,
  connectionDistance: 150,
  mouseInteractionDistance: 200,
  enableConnections: true,
  enableMouseInteraction: true,
  enable3DEffect: true
});

// 初始化图表
const tokenChart = new LineChart('#token-chart', {
  height: '300px',
  theme: 'dark'
});

const activityChart = new HeatMap('#activity-chart', {
  height: '300px',
  theme: 'dark'
});

// 模拟实时数据
setInterval(() => {
  // 更新统计数据
  document.getElementById('stat-agents').textContent = Math.floor(Math.random() * 20) + 5;
  document.getElementById('stat-tasks').textContent = Math.floor(Math.random() * 50) + 10;
  document.getElementById('stat-tokens').textContent = (Math.random() * 1000000 + 500000).toFixed(0);
  document.getElementById('stat-uptime').textContent = Math.floor(Math.random() * 24) + 'h';

  // 更新Token图表
  const tokenData = [];
  for (let i = 0; i < 12; i++) {
    tokenData.push({
      label: `${i * 2}h`,
      value: Math.floor(Math.random() * 500000) + 200000
    });
  }
  tokenChart.setData(tokenData);

  // 更新活动热力图
  const activityData = [
    { label: 'Main', values: Array(12).fill(0).map(() => Math.floor(Math.random() * 100)) },
    { label: 'Agent1', values: Array(12).fill(0).map(() => Math.floor(Math.random() * 80)) },
    { label: 'Agent2', values: Array(12).fill(0).map(() => Math.floor(Math.random() * 60)) },
    { label: 'Agent3', values: Array(12).fill(0).map(() => Math.floor(Math.random() * 40)) }
  ];
  activityChart.setData(activityData);
}, 5000);

// 页面导航
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', function() {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    this.classList.add('active');

    const pageId = 'page-' + this.dataset.page;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');

    // 粒子爆发效果
    particleSystem.burst(window.innerWidth / 2, window.innerHeight / 2, 20);
  });
});

// 鼠标移动时的粒子互动
document.addEventListener('mousemove', (e) => {
  if (Math.random() > 0.95) {
    particleSystem.burst(e.clientX, e.clientY, 3);
  }
});

// 窗口大小改变时调整粒子系统
window.addEventListener('resize', () => {
  particleSystem.resize();
});
</script>
</body>
</html>
