<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoopCLI - Agent 控制台 v7</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* v7 配色 - 赛博朋克深色主题 */
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text2: #8b949e;
  --text3: #6e7681;

  /* 品牌色 */
  --accent: #58a6ff;
  --accent2: #8b5cf6;
  --accent3: #06d6a0;
  --accent-gradient: linear-gradient(135deg, #58a6ff 0%, #8b5cf6 50%, #06d6a0 100%);

  /* 状态色 */
  --green: #06d6a0;
  --green-bg: rgba(6, 214, 160, 0.15);
  --yellow: #ffd000;
  --yellow-bg: rgba(255, 208, 0, 0.15);
  --red: #ff4757;
  --red-bg: rgba(255, 71, 87, 0.15);
  --blue: #58a6ff;
  --blue-bg: rgba(88, 166, 255, 0.15);
  --purple: #8b5cf6;
  --purple-bg: rgba(139, 92, 246, 0.15);

  --radius: 12px;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

body {
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* 布局 */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar {
  width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 侧边栏 */
.brand {
  padding: 24px 20px;
  border-bottom: 1px solid var(--border);
}
.brand h1 {
  font-size: 20px;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav {
  flex: 1;
  padding: 16px 8px;
  overflow-y: auto;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text2);
  font-size: 14px;
}
.nav-item:hover {
  background: var(--surface2);
  color: var(--text);
}
.nav-item.active {
  background: var(--accent-gradient);
  color: white;
}

/* 主内容区 */
.content {
  flex: 1;
  padding: 32px;
  overflow-y: auto;
}

.page-header {
  margin-bottom: 32px;
}
.page-header h2 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
}
.page-header p {
  color: var(--text2);
  font-size: 14px;
}

/* 统计卡片 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.stat-card .label {
  color: var(--text2);
  font-size: 13px;
  margin-bottom: 8px;
}
.stat-card .value {
  font-size: 32px;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Agent 卡片 */
.agents-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 20px;
}
.agent-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  transition: all 0.3s;
}
.agent-card:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow);
  transform: translateY(-2px);
}

.agent-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
}
.agent-name {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 4px;
}
.agent-id {
  font-size: 12px;
  color: var(--text3);
  font-family: monospace;
}

/* 状态徽章 */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.status-badge.idle {
  background: var(--green-bg);
  color: var(--green);
}
.status-badge.disabled {
  background: var(--red-bg);
  color: var(--red);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.agent-description {
  color: var(--text2);
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 16px;
}

.agent-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.agent-stat {
  font-size: 13px;
}
.agent-stat .label {
  color: var(--text3);
  margin-right: 4px;
}
.agent-stat .value {
  color: var(--text);
  font-weight: 600;
}

/* 任务进度条 */
.task-progress {
  grid-column: 1 / -1;
  margin-top: 8px;
}
.task-progress-bar {
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 4px;
}
.task-progress-fill {
  height: 100%;
  background: var(--accent-gradient);
  border-radius: 3px;
  transition: width 0.3s;
}

/* 操作按钮 */
.agent-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn {
  flex: 1;
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--accent-gradient);
  color: white;
}
.btn-primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}
.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  background: var(--surface);
}

/* 加载状态 */
.loading {
  text-align: center;
  padding: 60px;
  color: var(--text2);
}
.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--surface2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* 响应式 */
@media (max-width: 768px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; }
  .nav { display: flex; overflow-x: auto; }
  .nav-item { white-space: nowrap; }
  .content { padding: 16px; }
  .agents-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <h1>∞ LoopCLI</h1>
    </div>
    <nav class="nav">
      <div class="nav-item active" data-page="agents">
        <span>◈</span>
        <span>Agents</span>
      </div>
      <div class="nav-item" data-page="tasks">
        <span>◉</span>
        <span>Tasks</span>
      </div>
      <div class="nav-item" data-page="logs">
        <span>◐</span>
        <span>Logs</span>
      </div>
      <div class="nav-item" data-page="settings">
        <span>⚙</span>
        <span>Settings</span>
      </div>
    </nav>
  </aside>

  <!-- 主内容 -->
  <main class="main">
    <div class="content">
      <div class="page-header">
        <h2>Agent 控制台</h2>
        <p>管理和监控所有 Agent 的运行状态</p>
      </div>

      <!-- 统计 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">总 Agents</div>
          <div class="value" id="total-agents">-</div>
        </div>
        <div class="stat-card">
          <div class="label">运行中</div>
          <div class="value" id="active-agents">-</div>
        </div>
        <div class="stat-card">
          <div class="label">总任务数</div>
          <div class="value" id="total-tasks">-</div>
        </div>
        <div class="stat-card">
          <div class="label">已完成</div>
          <div class="value" id="done-tasks">-</div>
        </div>
      </div>

      <!-- Agents 列表 -->
      <div class="agents-grid" id="agents-grid">
        <div class="loading">
          <div class="spinner"></div>
          <div>加载 Agents...</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// API 基础 URL
const API_BASE = '/api';

// 获取 agents 数据
async function fetchAgents() {
  try {
    const response = await fetch(`${API_BASE}/agents`);
    if (!response.ok) throw new Error('API 请求失败');
    return await response.json();
  } catch (error) {
    console.error('获取 agents 失败:', error);
    return [];
  }
}

// 渲染统计
function renderStats(agents) {
  const total = agents.length;
  const active = agents.filter(a => a.status !== 'disabled').length;
  const totalTasks = agents.reduce((sum, a) => sum + (a.task_count || 0), 0);
  const doneTasks = agents.reduce((sum, a) => sum + (a.task_done || 0), 0);

  document.getElementById('total-agents').textContent = total;
  document.getElementById('active-agents').textContent = active;
  document.getElementById('total-tasks').textContent = totalTasks;
  document.getElementById('done-tasks').textContent = doneTasks;
}

// 渲染 agents
function renderAgents(agents) {
  const grid = document.getElementById('agents-grid');

  if (agents.length === 0) {
    grid.innerHTML = '<div class="loading"><div>暂无 Agents</div></div>';
    return;
  }

  grid.innerHTML = agents.map(agent => {
    const progress = agent.task_count > 0
      ? Math.round((agent.task_done / agent.task_count) * 100)
      : 0;

    return `
      <div class="agent-card" data-id="${agent.id}">
        <div class="agent-header">
          <div>
            <div class="agent-name">${agent.name}</div>
            <div class="agent-id">${agent.id}</div>
          </div>
          <span class="status-badge ${agent.status}">
            <span class="status-dot"></span>
            <span>${agent.status}</span>
          </span>
        </div>

        <div class="agent-description">
          ${agent.description || '暂无描述'}
        </div>

        <div class="agent-stats">
          <div class="agent-stat">
            <span class="label">运行次数:</span>
            <span class="value">${agent.run_count || 0}</span>
          </div>
          <div class="agent-stat">
            <span class="label">最后运行:</span>
            <span class="value">${agent.last_run || '从未'}</span>
          </div>
          <div class="agent-stat">
            <span class="label">任务:</span>
            <span class="value">${agent.task_done}/${agent.task_count}</span>
          </div>
          <div class="agent-stat">
            <span class="label">当前任务:</span>
            <span class="value">${agent.current_task || '无'}</span>
          </div>
          ${agent.task_count > 0 ? `
          <div class="task-progress">
            <div class="task-progress-bar">
              <div class="task-progress-fill" style="width: ${progress}%"></div>
            </div>
          </div>
          ` : ''}
        </div>

        <div class="agent-actions">
          <button class="btn btn-primary" onclick="enableAgent('${agent.id}')">
            启用
          </button>
          <button class="btn btn-secondary" onclick="disableAgent('${agent.id}')">
            禁用
          </button>
        </div>
      </div>
    `;
  }).join('');
}

// 启用 agent
async function enableAgent(id) {
  try {
    const response = await fetch(`${API_BASE}/agents/${id}/enable`, { method: 'POST' });
    if (response.ok) {
      location.reload();
    }
  } catch (error) {
    console.error('启用失败:', error);
  }
}

// 禁用 agent
async function disableAgent(id) {
  try {
    const response = await fetch(`${API_BASE}/agents/${id}/disable`, { method: 'POST' });
    if (response.ok) {
      location.reload();
    }
  } catch (error) {
    console.error('禁用失败:', error);
  }
}

// 导航切换
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
  });
});

// 初始化
async function init() {
  const agents = await fetchAgents();
  renderStats(agents);
  renderAgents(agents);
}

init();
</script>
</body>
</html>
